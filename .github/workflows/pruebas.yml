name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

# Las acciones van fijadas por SHA (con su versión al lado): una etiqueta movida no puede cambiar lo que corre aquí.
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Tipos sin compilar (etapa 22): db.js, historial.js, respaldo.js y juego.js llevan // @ts-check.
      - run: npm run tipos
      # Las pruebas unitarias con cobertura: el resumen sale en la página del trabajo y el lcov como artefacto.
      - run: npm run test:cobertura
      - run: node tools/cobertura-resumen.mjs lcov.info
        if: always() && hashFiles('lcov.info') != ''
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && hashFiles('lcov.info') != ''
        with:
          name: cobertura
          path: lcov.info
          retention-days: 14

  # Las mismas unitarias en tres zonas horarias más: la de Ander (sin horario de verano) y dos con horario de verano (cambian la hora en fechas distintas).
  # En UTC no se ven los fallos de «medianoche local» ni los del cambio de hora (QA-F1, QA-F2 de la ronda 2).
  zonas:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tz: [America/Mexico_City, Europe/Madrid, America/Los_Angeles]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    # Las e2e van en dos mitades en paralelo: juntas tardaban 18–23 min con un tope de 25.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --shard=1/2
      # Las que pasaron solo al reintentar salen en el resumen del trabajo.
      - run: node tools/e2e-inestables.mjs e2e-resultados.json
        if: always()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: informe-e2e-1
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e-2:
    runs-on: ubuntu-latest
    # Las e2e van en dos mitades en paralelo: juntas tardaban 18–23 min con un tope de 25.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --shard=2/2
      # Las que pasaron solo al reintentar salen en el resumen del trabajo.
      - run: node tools/e2e-inestables.mjs e2e-resultados.json
        if: always()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: informe-e2e-2
          path: |
            playwright-report/
            test-results/
          retention-days: 7
